name: react ci
on: push

jobs:
    run-test:
        runs-on: ubuntu-latest
        steps:
            - name: checkout Code
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '18'
            - name: install dependencies
              run: npm install
            - name: run test
              run: npm run test
              